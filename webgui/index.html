<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Per-Key Colors</title>
<style>
  :root {
    --bg: #131418; --panel: #1c1e25; --panel2: #262932; --border: #34384330;
    --border-strong: #3d4149; --text: #e8e9ee; --text-dim: #8b8f9c;
    --accent: #2dd4a8; --accent-dim: #1f8f74; --accent-text: #0b1210;
    --err: #ff6b6b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    margin: 0; padding: 2rem clamp(1rem, 4vw, 3rem); background: var(--bg); color: var(--text);
  }
  header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.35rem; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  h1 .dim { color: var(--text-dim); font-weight: 500; }
  .subtitle { margin: .25rem 0 0; color: var(--text-dim); font-size: .85rem; }

  .toolbar { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  #status { font-size: .82rem; color: var(--text-dim); padding: .35rem .7rem .35rem .6rem;
            background: var(--panel); border: 1px solid var(--border-strong); border-radius: 999px;
            display: inline-flex; align-items: center; gap: .45rem; }
  #status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--err); flex: none; }
  #status.connected::before { background: var(--accent); }
  #status.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--border-strong)); }
  .toolbar .spacer { flex: 1; }

  button { font: inherit; font-weight: 550; padding: .5rem 1rem; cursor: pointer;
           background: var(--panel2); color: var(--text); border: 1px solid var(--border-strong);
           border-radius: 8px; transition: background .12s, border-color .12s, transform .05s; }
  button:hover:not(:disabled) { border-color: var(--text-dim); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, white); }

  #layers { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
  #layers button { padding: .4rem .85rem; font-size: .82rem; background: var(--panel);
                    border-color: var(--border-strong); }
  #layers button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .board-card { background: var(--panel); border: 1px solid var(--border-strong);
                border-radius: var(--radius); padding: 2rem clamp(1rem, 3vw, 2.5rem);
                display: flex; flex-direction: column; align-items: center; }
  .board { position: relative; }
  .key { position: absolute; width: 48px; height: 48px; border-radius: 6px;
         border: 1px solid var(--border-strong); cursor: pointer; box-sizing: border-box;
         background: #2a2d36; box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
         transition: left .12s, top .12s, border-color .12s, transform .08s, box-shadow .12s; }
  .key:hover { border-color: var(--text); transform: scale(1.08); z-index: 1; }
  .key.selected, .ug.selected { outline: 2px solid var(--accent); outline-offset: 1px;
                                 box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  #marquee { position: fixed; border: 1px dashed var(--accent);
             background: color-mix(in srgb, var(--accent) 12%, transparent);
             pointer-events: none; z-index: 20; display: none; border-radius: 3px; }

  .underglow-row { margin-top: 1.1rem; display: flex; flex-direction: column; align-items: center; }
  .underglow-row.hidden { display: none; }
  .underglow-row .label { color: var(--text-dim); margin-bottom: .4rem; font-size: .78rem;
                           text-transform: uppercase; letter-spacing: .04em; }
  .underglow-box { position: relative; }
  .ug { position: absolute; width: 32px; height: 32px; border-radius: 4px; background: #2a2d36;
        border: 1px solid var(--border-strong); cursor: pointer; box-sizing: border-box;
        transition: left .12s, top .12s, border-color .12s, transform .08s; }
  .ug:hover { border-color: var(--text); transform: scale(1.2); z-index: 1; }

  #picker-popup { position: absolute; z-index: 10; background: var(--panel2);
                  border: 1px solid var(--border-strong); border-radius: var(--radius);
                  padding: .85rem; display: flex; flex-direction: column; gap: .7rem;
                  box-shadow: 0 12px 28px rgba(0,0,0,.45); min-width: 168px; }
  #picker-popup.hidden { display: none; }
  #picker-popup .row { display: flex; gap: .4rem; align-items: center; }
  #pp-color { width: 40px; height: 32px; padding: 0; border: 1px solid var(--border-strong);
              border-radius: 6px; background: none; cursor: pointer; }
  #pp-hex { width: 5.5rem; font: inherit; background: var(--bg); color: var(--text);
            border: 1px solid var(--border-strong); border-radius: 6px; padding: .35rem .5rem; }
  #pp-hex:focus, #pp-color:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .favorites { display: flex; flex-wrap: wrap; gap: 5px; max-width: 168px; }
  .fav-swatch { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border-strong);
                cursor: pointer; transition: transform .08s, border-color .1s; }
  .fav-swatch:hover { border-color: var(--text); transform: scale(1.12); }
  #pp-fav-add { font-size: .78rem; padding: .35rem .7rem; }

  .lock-row { display: flex; flex-direction: column; gap: .3rem; padding-top: .5rem;
              border-top: 1px solid var(--border-strong); }
  .lock-row label { display: flex; align-items: center; gap: .4rem; font-size: .78rem;
                     color: var(--text-dim); cursor: pointer; }
  .lock-row input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

  .pp-tabs { display: flex; gap: .3rem; background: var(--bg); padding: 3px; border-radius: 7px; }
  .pp-tab { font-size: .74rem; font-weight: 550; padding: .3rem .6rem; background: transparent;
            border: 1px solid transparent; border-radius: 5px; color: var(--text-dim); cursor: pointer; flex: 1; }
  .pp-tab:hover:not(.active) { color: var(--text); }
  .pp-tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .pp-tabpanel.hidden { display: none; }
  .wheel-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto; }
  #pp-wheel { border-radius: 50%; cursor: crosshair; touch-action: none;
              box-shadow: 0 0 0 1px var(--border-strong); }
  .wheel-marker { position: absolute; width: 10px; height: 10px; border: 2px solid #fff;
                  border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
                  box-shadow: 0 0 3px rgba(0,0,0,.6); }
  #pp-value { width: 140px; margin: .5rem auto 0; display: block; accent-color: var(--accent); }
  .color-grid { display: grid; gap: 3px; }
  .grid-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border-strong);
                 cursor: pointer; transition: transform .08s; }
  .grid-swatch:hover { border-color: var(--text); transform: scale(1.15); }
</style>
</head>
<body>

<header>
  <h1 id="title">Per-Key Colors <span class="dim">/ WebHID</span></h1>
  <p class="subtitle">Per-key RGB assignment over WebHID — works with any connected Vial keyboard</p>
</header>

<div class="toolbar">
  <div id="status">Click Connect to read layout from keyboard</div>
  <div class="spacer"></div>
  <button id="export" disabled>Export…</button>
  <button id="import" disabled>Import…</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <button id="connect" disabled>Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <button id="save" class="primary" disabled>Save (EEPROM)</button>
</div>

<div id="layers"></div>

<section class="board-card">
  <div id="board" class="board"></div>
  <div id="underglow-row" class="underglow-row hidden">
    <div class="label">Underglow</div>
    <div id="ug" class="underglow-box"></div>
  </div>
</section>

<div id="picker-popup" class="hidden">
  <div class="row">
    <input type="color" id="pp-color" value="#ff0000">
    <input type="text" id="pp-hex" value="#ff0000" maxlength="7" placeholder="#rrggbb">
  </div>
  <div class="pp-tabs">
    <button type="button" class="pp-tab active" data-tab="wheel">Wheel</button>
    <button type="button" class="pp-tab" data-tab="grid">Palette</button>
  </div>
  <div id="pp-tab-wheel" class="pp-tabpanel">
    <div class="wheel-wrap">
      <canvas id="pp-wheel" width="140" height="140"></canvas>
      <div id="pp-wheel-marker" class="wheel-marker"></div>
    </div>
    <input type="range" id="pp-value" min="0" max="100" value="100">
  </div>
  <div id="pp-tab-grid" class="pp-tabpanel hidden">
    <div id="pp-grid" class="color-grid"></div>
  </div>
  <div id="pp-favorites" class="favorites"></div>
  <button id="pp-fav-add">+ Add favorite</button>
  <div class="lock-row">
    <label><input type="checkbox" id="pp-lock-num"> NumLock</label>
    <label><input type="checkbox" id="pp-lock-caps"> CapsLock</label>
    <label><input type="checkbox" id="pp-lock-scrl"> ScrollLock</label>
    <label><input type="checkbox" id="pp-lock-blink"> Blink</label>
  </div>
  <div class="row hidden" id="pp-blink-row">
    <input type="color" id="pp-blink-color" value="#ff0000">
    <input type="text" id="pp-blink-hex" value="#ff0000" maxlength="7" placeholder="#rrggbb">
  </div>
</div>
<div id="marquee"></div>

<script src="vendor/xz-decompress.min.js"></script>
<script>
'use strict';

// Protokoll: 32-Byte Raw HID Reports, byte0 = 0x02 (Familie), byte1 = Subcommand.
// Referenz: entry_wave.c raw_hid_receive_kb() — identisch auf jedem Board,
// das diese Keymap-Erweiterung trägt (sofle_panda, id75v3rp, ...).
const USAGE_PAGE = 0xFF60, USAGE = 0x61;
const SET_KEY_COLORS = 0xA5;
const COMMIT_COLORS  = 0xA6;
const GET_KEY_COLORS = 0xA7;
const SET_LOCK_FLAGS = 0xA8;
const GET_LOCK_FLAGS = 0xA9;
const SET_BLINK_COLORS = 0xAA;
const GET_BLINK_COLORS = 0xAB;

// Lock-state gate bits (müssen zu LOCK_FLAG_* in dynamic_lights.h/key_colors.h passen).
const LOCK_FLAG_NUM   = 1 << 0;
const LOCK_FLAG_CAPS  = 1 << 1;
const LOCK_FLAG_SCRL  = 1 << 2;
const LOCK_FLAG_BLINK = 1 << 3; // alternates the key between its color and blinkColors every 800ms

const KEY_COLOR_CHUNK  = 9;  // matches KEY_COLOR_CHUNK_MAX in entry_wave.c
const LOCK_FLAGS_CHUNK = 27; // matches LOCK_FLAGS_CHUNK_MAX in entry_wave.c
const BASE_SCALE   = 58;   // px pro Layout-Einheit (KLE x/y) bei voller Größe
const MIN_SCALE_FACTOR = 0.5; // nie kleiner als die Hälfte — bleibt lesbar/klickbar
let   SCALE = BASE_SCALE;  // wird bei jedem (Re-)Layout an die Fensterbreite angepasst
const UG_SCALE = 2.8;      // px pro Einheit im LED-Effekt-Koordinatenraum (rgb_matrix.layout) — mit .ug-Dot-Größe mitskaliert, sonst überlappen sich die Dots
const UG_PAD   = 18;       // Platz für die Dot-Größe

// Vial-Kernprotokoll (0xFE-Präfix) — schon in jeder Vial-QMK-Firmware
// eingebaut, kein Firmware-Code nötig. Liefert dieselbe komprimierte
// Keyboard-Definition (KLE-Layout + rgb_matrix), aus der auch keyboard.json/
// vial.json beim Firmware-Build generiert werden — nur eben live vom
// verbundenen Board statt aus lokalen Dateien, board-unabhängig portabel.
// Referenz: ~/Projects/keypeek/src/protocols/vial.rs + kle_parser.rs.
const VIAL_PREFIX   = 0xFE;
const VIAL_CMD_KBID = 0x00;
const VIAL_CMD_SIZE = 0x01;
const VIAL_CMD_DEF  = 0x02;

// VIA-Kernprotokoll (kein Vial-Zusatz, Standard auf jeder VIA/Vial-Firmware).
const VIA_CMD_GET_LAYER_COUNT = 0x11;

// LED_COUNT/LAYER_COUNT werden NICHT hart hinterlegt — kommen live vom
// verbundenen Board (rgb_matrix.layout.length bzw. VIA get-layer-count),
// damit dieselbe Datei auf jedem Board funktioniert (Split oder Unibody,
// beliebige LED-/Layer-Zahl), ohne Board-spezifische Kopie.
let LED_COUNT   = 0;
let LAYER_COUNT = 0;
let keyboardName = 'Keyboard';

let device = null;
let currentLayer = 0;
let colors = [];      // erst nach dem Verbinden befüllt, sobald LED_COUNT/LAYER_COUNT bekannt sind
let lockFlags = [];   // dito — [layer][led] = Bitmaske aus LOCK_FLAG_*
let blinkColors = []; // dito — [layer][led] = zweite Farbe, aktiv bei LOCK_FLAG_BLINK
let pending = null; // {match, resolve}

// Physische Tasten + Underglow-LEDs, live vom Board geladen (loadLayoutFromDevice).
// Ein durchgehender Board-Bereich für alle Tasten (echte KLE-Koordinaten
// trennen Split-Hälften optisch von selbst, kein Links/Rechts-Sonderfall nötig).
let keyElements = []; // [{el, led}]
let underglow   = []; // [{el, led}]

const statusEl  = document.getElementById('status');
const titleEl   = document.getElementById('title');
const boardEl   = document.getElementById('board');
const layersEl  = document.getElementById('layers');
const ugRowEl   = document.getElementById('underglow-row');
const ugEl      = document.getElementById('ug');
const connectBtn  = document.getElementById('connect');
const disconnectBtn = document.getElementById('disconnect');
const saveBtn     = document.getElementById('save');
const exportBtn   = document.getElementById('export');
const importBtn   = document.getElementById('import');
const importFileEl = document.getElementById('import-file');
const popupEl     = document.getElementById('picker-popup');
const ppColorEl   = document.getElementById('pp-color');
const ppHexEl     = document.getElementById('pp-hex');
const ppFavoritesEl = document.getElementById('pp-favorites');
const ppFavAddEl  = document.getElementById('pp-fav-add');
const ppLockNumEl  = document.getElementById('pp-lock-num');
const ppLockCapsEl = document.getElementById('pp-lock-caps');
const ppLockScrlEl = document.getElementById('pp-lock-scrl');
const ppLockBlinkEl  = document.getElementById('pp-lock-blink');
const ppBlinkRowEl   = document.getElementById('pp-blink-row');
const ppBlinkColorEl = document.getElementById('pp-blink-color');
const ppBlinkHexEl   = document.getElementById('pp-blink-hex');
const ppWheelEl   = document.getElementById('pp-wheel');
const ppMarkerEl  = document.getElementById('pp-wheel-marker');
const ppValueEl   = document.getElementById('pp-value');
const ppGridEl    = document.getElementById('pp-grid');

const GRID_BASE_HUES = ['#c00000', '#ff0000', '#ff8c00', '#ffd200', '#92d050', '#00b050', '#00b0f0', '#0070c0', '#002060', '#7030a0'];

const DEFAULT_FAVORITES = ['#ff0000', '#00ff00', '#0050ff', '#ffd200', '#ff00c8', '#00ffff', '#ffffff', '#000000'];
let favorites = DEFAULT_FAVORITES.slice();
try { favorites = JSON.parse(localStorage.getItem('webgui_fav_colors')) || favorites; } catch (_) {}
let lastColor = favorites[0];
let selected = new Set();          // led-Indizes der aktuell markierten Tasten
const ledToEl = new Map();         // led -> DOM-Element, für Mehrfachauswahl

function setStatus(text, isErr) {
    statusEl.textContent = text;
    statusEl.classList.toggle('err', !!isErr); // 'connected' bleibt erhalten, nur Fehler-Ton wechselt
}

function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 0xFF, (n >> 8) & 0xFF, n & 0xFF];
}
function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function hsvToRgb(h, s, v) { // h:0-360, s/v:0-1 -> [r,g,b] 0-255
    const c = v * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
                     : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
function rgbToHsv(r, g, b) { // 0-255 -> [h 0-360, s 0-1, v 0-1]
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d !== 0) {
        if (max === r) h = 60 * (((g - b) / d) % 6);
        else if (max === g) h = 60 * ((b - r) / d + 2);
        else h = 60 * ((r - g) / d + 4);
    }
    if (h < 0) h += 360;
    return [h, max === 0 ? 0 : d / max, max];
}

function mixHex(hex, target, amount) { // amount 0..1 Richtung target=[r,g,b] (Tint/Shade)
    const [r, g, b] = hexToRgb(hex);
    return rgbToHex(
        Math.round(r + (target[0] - r) * amount),
        Math.round(g + (target[1] - g) * amount),
        Math.round(b + (target[2] - b) * amount),
    );
}

// ─── Vial-Definition + VIA-Basics live vom Board (0xFE-Protokoll + XZ) ────────

async function vialCommand(cmd, payload) {
    const msg = [VIAL_PREFIX, cmd, ...(payload || [])];
    await send(msg);
    return waitFor(() => true); // Vial-Antworten echoen kein cmd/subcmd — nächster Report ist die Antwort
}

async function vialGetProtocolVersion() {
    const d = await vialCommand(VIAL_CMD_KBID);
    return d.getUint32(0, true);
}

async function vialGetDefinitionSize() {
    const d = await vialCommand(VIAL_CMD_SIZE);
    return d.getUint32(0, true);
}

async function vialGetDefBlock(block) {
    const payload = [block & 0xFF, (block >> 8) & 0xFF, (block >> 16) & 0xFF, (block >> 24) & 0xFF];
    return vialCommand(VIAL_CMD_DEF, payload);
}

async function fetchVialDefinitionJson() {
    const protocolVersion = await vialGetProtocolVersion();
    if (protocolVersion === 0) throw new Error('device does not support the Vial protocol');

    const size = await vialGetDefinitionSize();
    if (!size) throw new Error('Vial definition size is 0');

    const compressed = new Uint8Array(size);
    let offset = 0, block = 0;
    while (offset < size) {
        const d = await vialGetDefBlock(block);
        const chunkSize = Math.min(32, size - offset);
        for (let i = 0; i < chunkSize; i++) compressed[offset + i] = d.getUint8(i);
        offset += chunkSize;
        block++;
    }

    const XzReadableStream = window['xz-decompress'].XzReadableStream;
    const decompressedStream = new XzReadableStream(new Response(compressed).body);
    const jsonText = await new Response(decompressedStream).text();
    return JSON.parse(jsonText);
}

// Standard-VIA-Befehl (kein Vial-Zusatz) — Request/Response teilen sich den
// 32-Byte-Puffer: byte0 = command_id (echoed zurück), byte1.. = Payload/Result.
async function viaGetLayerCount() {
    await send([VIA_CMD_GET_LAYER_COUNT]);
    const d = await waitFor(r => r.getUint8(0) === VIA_CMD_GET_LAYER_COUNT);
    return d.getUint8(1);
}

// ─── KLE-Parser (JS-Port von keypeek/src/protocols/kle_parser.rs) ─────────────
// Löst dieselbe rohe Vial layouts.keymap-Notation auf, aus der QMKs Build
// beim Kompilieren keyboard.json's flache {matrix,x,y}-Liste erzeugt.

function flattenRotation(x, y, w, h, angleDeg, pivotX, pivotY) {
    if (Math.abs(angleDeg) <= 1e-6) return [x, y];
    const cx = x + w / 2, cy = y + h / 2;
    const lx = cx - pivotX, ly = cy - pivotY;
    const rad = angleDeg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const rcx = lx * cos - ly * sin + pivotX;
    const rcy = lx * sin + ly * cos + pivotY;
    return [rcx - w / 2, rcy - h / 2];
}

function parseMatrixLabel(label) {
    const firstLine = label.split('\n')[0];
    const parts = firstLine.split(',');
    if (parts.length < 2) return null;
    const row = parseInt(parts[0].trim(), 10), col = parseInt(parts[1].trim(), 10);
    return Number.isNaN(row) || Number.isNaN(col) ? null : [row, col];
}

// VIA/Vial-Konvention: Encoder-Rotation (CW/CCW) hat keine eigene Matrix-Scan-
// Position, sondern bindet auf dieselbe row,col wie eine echte Taste, nur mit
// einer letzten Legend-Zeile "e" markiert (z.B. "0,1\n\n\n\n\n\n\n\n\ne" — das
// sind 9 Newlines/10 Teile, "e" landet also auf dem LETZTEN Split-Element,
// nicht auf einem festen Index). Skip, sonst zwei Squares mit identischer LED.
function isEncoderLabel(label) {
    const lines = label.split('\n');
    return lines.length > 1 && lines[lines.length - 1] === 'e';
}

function parseKleKeymap(keymap) {
    const keys = [];
    let currentY = 0, rotAngle = 0, rotX = 0, rotY = 0;

    for (const row of keymap) {
        if (!Array.isArray(row)) continue;
        let currentX = 0, currentW = 1, currentH = 1;

        for (const item of row) {
            if (typeof item === 'string') {
                if (!isEncoderLabel(item)) {
                    const rc = parseMatrixLabel(item);
                    if (rc) {
                        const absX = rotX + currentX, absY = rotY + currentY;
                        const [fx, fy] = flattenRotation(absX, absY, currentW, currentH, rotAngle, rotX, rotY);
                        keys.push({ matrix: rc, x: fx, y: fy, w: currentW, h: currentH });
                    }
                }
                currentX += currentW;
                currentW = 1; currentH = 1;
            } else if (item && typeof item === 'object') {
                let originChanged = false;
                if ('rx' in item) { rotX = item.rx; originChanged = true; }
                if ('ry' in item) { rotY = item.ry; originChanged = true; }
                if (originChanged) { currentX = 0; currentY = 0; }
                if ('r' in item) rotAngle = item.r;
                if ('w' in item) currentW = item.w;
                if ('h' in item) currentH = item.h;
                if ('x' in item) currentX += item.x;
                if ('y' in item) currentY += item.y;
            }
        }
        currentY += 1;
    }
    return keys;
}

// Ein durchgehender Board-Bereich für ALLE Tasten — bei Split-Boards trennen
// sich die Hälften rein durch die reale KLE-x/y-Lücke optisch von selbst,
// kein Links/Rechts-Sonderfall im Code nötig.
function layoutKeys(keys, matrixToLed) {
    const minX = Math.min(...keys.map(k => k.x));
    const maxX = Math.max(...keys.map(k => k.x + 1 - minX));
    const maxY = Math.max(...keys.map(k => k.y + 1));
    boardEl.style.width  = (maxX * SCALE) + 'px';
    boardEl.style.height = (maxY * SCALE) + 'px';

    keys.forEach(k => {
        // Keine echte Matrix->LED-Zuordnung (z.B. Encoder-Push-Button auf
        // Boards, die sowas haben) -> nicht zeichnen, sonst Farb-
        // Überschneidung mit der echten Taste, die dieselbe LED teilt.
        const led = matrixToLed[k.matrix.join(',')];
        if (led === undefined) return;

        const el = document.createElement('div');
        el.className = 'key';
        el.style.left = ((k.x - minX) * SCALE) + 'px';
        el.style.top  = (k.y * SCALE) + 'px';
        el.title = `LED ${led}`;
        el.onclick = (ev) => onSelectableClick(led, el, ev);
        ledToEl.set(led, el);
        boardEl.appendChild(el);
        keyElements.push({ el, led });
    });
}

// ─── Responsive: Tasten-Raster passt sich (nur verkleinernd, nie größer als
// BASE_SCALE) an die verfügbare Breite an, bis MIN_SCALE_FACTOR erreicht ist.

let lastKeys = null, lastMatrixToLed = null, lastUgEntries = null;
const boardCardEl = document.querySelector('.board-card');

function computeResponsiveScale(keys) {
    const minX = Math.min(...keys.map(k => k.x));
    const gridUnits = Math.max(...keys.map(k => k.x + 1 - minX));
    const cardStyle = getComputedStyle(boardCardEl);
    const available = boardCardEl.clientWidth - parseFloat(cardStyle.paddingLeft) - parseFloat(cardStyle.paddingRight);
    const naturalWidth = gridUnits * BASE_SCALE;
    const factor = Math.min(1, available > 0 ? available / naturalWidth : 1);
    return Math.max(MIN_SCALE_FACTOR, factor) * BASE_SCALE;
}

// Baut das Board mit den zuletzt geladenen Daten neu auf (z.B. nach Resize
// oder Layer-unabhängigem Redraw) — ohne erneute HID-Abfrage.
function relayout() {
    if (!lastKeys) return;
    SCALE = computeResponsiveScale(lastKeys);
    resetBoard();
    layoutKeys(lastKeys, lastMatrixToLed);
    layoutUnderglow(lastUgEntries);
    if (colors.length) redrawBoard();
}

let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 120); // entprellt — nicht bei jedem Resize-Frame neu layouten
});

function layoutUnderglow(entries) {
    ugRowEl.classList.toggle('hidden', entries.length === 0);
    if (entries.length === 0) return;

    const minX = Math.min(...entries.map(e => e.x));
    const minY = Math.min(...entries.map(e => e.y));
    const maxX = Math.max(...entries.map(e => e.x - minX));
    const maxY = Math.max(...entries.map(e => e.y - minY));
    ugEl.style.width  = (maxX * UG_SCALE + UG_PAD) + 'px';
    ugEl.style.height = (maxY * UG_SCALE + UG_PAD) + 'px';

    entries.forEach(({ led, x, y }) => {
        const el = document.createElement('div');
        el.className = 'ug';
        el.title = `LED ${led}`;
        el.style.left = ((x - minX) * UG_SCALE) + 'px';
        el.style.top  = ((y - minY) * UG_SCALE) + 'px';
        el.onclick = (ev) => onSelectableClick(led, el, ev);
        ledToEl.set(led, el);
        ugEl.appendChild(el);
        underglow.push({ el, led });
    });
}

// Räumt das Board-DOM/State aus einer evtl. vorherigen Verbindung weg — nötig
// falls disconnect+reconnect mit einem anderen Board passiert.
function resetBoard() {
    boardEl.innerHTML = '';
    ugEl.innerHTML = '';
    keyElements = []; underglow = [];
    ledToEl.clear();
    clearSelection();
}

// Lädt Layout + Matrix->LED-Zuordnung LIVE vom verbundenen Board über Vials
// eigenes Definition-Protokoll (0xFE, s.o.) — dieselbe komprimierte KLE-JSON,
// aus der auch das lokale keyboard.json/vial.json beim Firmware-Build
// generiert wird, nur direkt vom Gerät statt aus Repo-Dateien. Board-
// unabhängig portabel: funktioniert unverändert auf jedem Vial-Board, egal
// ob Split oder Unibody, egal wie viele LEDs/Layer.
async function loadLayoutFromDevice() {
    const json = await fetchVialDefinitionJson();
    if (!json.rgb_matrix || !json.rgb_matrix.layout) {
        throw new Error('Vial definition has no rgb_matrix.layout — cannot map LEDs to keys');
    }

    keyboardName = json.name || 'Keyboard';
    titleEl.innerHTML = keyboardName + ' <span class="dim">/ WebHID</span>';
    LED_COUNT = json.rgb_matrix.layout.length;

    const matrixToLed = {};
    const ugEntries = [];
    json.rgb_matrix.layout.forEach((entry, led) => {
        if (entry.matrix) { matrixToLed[entry.matrix.join(',')] = led; return; }
        // flags:8 (LED_FLAG_INDICATOR) hat keine eigene Matrix-Taste — auf
        // sofle_panda stellte sich raus, dass sowas hardwareseitig dieselbe
        // LED wie eine Nachbartaste teilt, nicht separat steuerbar. Nicht rendern.
        if (entry.flags === 8) return;
        ugEntries.push({ led, x: entry.x, y: entry.y });
    });

    lastKeys = parseKleKeymap(json.layouts.keymap); // [{matrix:[row,col], x, y}, ...] (Encoder-Labels raus)
    lastMatrixToLed = matrixToLed;
    lastUgEntries = ugEntries;

    SCALE = computeResponsiveScale(lastKeys);
    resetBoard();
    layoutKeys(lastKeys, lastMatrixToLed);
    layoutUnderglow(lastUgEntries);
}

// Sendet einen 32-Byte Report (report ID 0, device hat keine numbered reports).
async function send(bytes) {
    if (!device) throw new Error('not connected');
    const buf = new Uint8Array(32);
    buf.set(bytes.slice(0, 32));
    await device.sendReport(0, buf);
}

// Wartet auf die nächste Antwort, die `match` erfüllt (Timeout 1s, überschreibbar).
// Prüft mehr als nur den Subcommand — eine verspätete/vertauschte Antwort auf
// eine ANDERE Chunk-Anfrage darf nicht fälschlich als "die richtige"
// akzeptiert werden, sonst landen Farben beim Auslesen an falschen LED-Offsets.
function waitFor(match, timeoutMs) {
    return new Promise((resolve, reject) => {
        const entry = { match, resolve };
        pending = entry;
        setTimeout(() => {
            if (pending === entry) { pending = null; reject(new Error('timeout')); }
        }, timeoutMs || 1000);
    });
}

function onInputReport(e) {
    const d = e.data;
    // Kein globaler Family-Filter mehr hier — Vial-/VIA-Antworten echoen kein
    // 0x02-Präfix zurück, byte0 ist bereits Nutzdaten. Filterung passiert im
    // jeweiligen `match`-Prädikat (s. fetchLayerColors, viaGetLayerCount).
    if (pending && pending.match(d)) {
        const p = pending;
        pending = null;
        p.resolve(d);
    }
}

async function fetchLayerColors(layer) {
    for (let offset = 0; offset < LED_COUNT; offset += KEY_COLOR_CHUNK) {
        const count = Math.min(KEY_COLOR_CHUNK, LED_COUNT - offset);
        await send([0x02, GET_KEY_COLORS, layer, offset, count]);
        const d = await waitFor(r => r.getUint8(0) === 0x02 && r.getUint8(1) === GET_KEY_COLORS && r.getUint8(2) === layer && r.getUint8(3) === offset);
        for (let i = 0; i < count; i++) {
            const r = d.getUint8(5 + i * 3), g = d.getUint8(5 + i * 3 + 1), b = d.getUint8(5 + i * 3 + 2);
            colors[layer][offset + i] = rgbToHex(r, g, b);
        }
    }
}

async function fetchLayerBlinkColors(layer) {
    for (let offset = 0; offset < LED_COUNT; offset += KEY_COLOR_CHUNK) {
        const count = Math.min(KEY_COLOR_CHUNK, LED_COUNT - offset);
        await send([0x02, GET_BLINK_COLORS, layer, offset, count]);
        const d = await waitFor(r => r.getUint8(0) === 0x02 && r.getUint8(1) === GET_BLINK_COLORS && r.getUint8(2) === layer && r.getUint8(3) === offset);
        for (let i = 0; i < count; i++) {
            const r = d.getUint8(5 + i * 3), g = d.getUint8(5 + i * 3 + 1), b = d.getUint8(5 + i * 3 + 2);
            blinkColors[layer][offset + i] = rgbToHex(r, g, b);
        }
    }
}

async function fetchLayerLockFlags(layer) {
    for (let offset = 0; offset < LED_COUNT; offset += LOCK_FLAGS_CHUNK) {
        const count = Math.min(LOCK_FLAGS_CHUNK, LED_COUNT - offset);
        await send([0x02, GET_LOCK_FLAGS, layer, offset, count]);
        const d = await waitFor(r => r.getUint8(0) === 0x02 && r.getUint8(1) === GET_LOCK_FLAGS && r.getUint8(2) === layer && r.getUint8(3) === offset);
        for (let i = 0; i < count; i++) lockFlags[layer][offset + i] = d.getUint8(5 + i);
    }
}

async function sendKeyColor(layer, led, hex) {
    const [r, g, b] = hexToRgb(hex);
    await send([0x02, SET_KEY_COLORS, layer, led, 1, r, g, b]);
}

async function sendKeyLockFlags(layer, led, flags) {
    await send([0x02, SET_LOCK_FLAGS, layer, led, flags]);
}

async function sendBlinkColor(layer, led, hex) {
    const [r, g, b] = hexToRgb(hex);
    await send([0x02, SET_BLINK_COLORS, layer, led, 1, r, g, b]);
}

function buildLayerTabs() {
    layersEl.innerHTML = '';
    for (let i = 0; i < LAYER_COUNT; i++) {
        const btn = document.createElement('button');
        btn.textContent = `Layer ${i}`;
        btn.className = i === currentLayer ? 'active' : '';
        btn.onclick = () => selectLayer(i);
        layersEl.appendChild(btn);
    }
}

function redrawBoard() {
    keyElements.forEach(({ el, led }) => { el.style.background = colors[currentLayer][led]; });
    underglow.forEach(({ el, led }) => { el.style.background = colors[currentLayer][led]; });
}

function saveFavorites() {
    localStorage.setItem('webgui_fav_colors', JSON.stringify(favorites));
}

function renderFavorites() {
    ppFavoritesEl.innerHTML = '';
    favorites.forEach(hex => {
        const sw = document.createElement('div');
        sw.className = 'fav-swatch';
        sw.style.background = hex;
        sw.title = hex;
        sw.onclick = () => applyColor(hex);
        ppFavoritesEl.appendChild(sw);
    });
}

// ─── Farbrad (Hue/Sat-Kreis + separater Value-Regler) ─────────────────────────

function drawWheel() {
    const ctx = ppWheelEl.getContext('2d');
    const W = ppWheelEl.width, H = ppWheelEl.height, cx = W / 2, cy = H / 2, R = Math.min(cx, cy) - 1;
    const img = ctx.createImageData(W, H);
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const dx = x - cx, dy = y - cy, dist = Math.sqrt(dx * dx + dy * dy);
            const idx = (y * W + x) * 4;
            if (dist > R) { img.data[idx + 3] = 0; continue; }
            let hue = Math.atan2(dy, dx) * 180 / Math.PI;
            if (hue < 0) hue += 360;
            const [r, g, b] = hsvToRgb(hue, Math.min(dist / R, 1), 1);
            img.data[idx] = r; img.data[idx + 1] = g; img.data[idx + 2] = b; img.data[idx + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
}

// Positioniert den Marker-Punkt anhand von Hue/Sat (0-360 / 0-1) auf dem Rad.
function positionMarker(hue, sat) {
    const cx = ppWheelEl.width / 2, cy = ppWheelEl.height / 2, R = Math.min(cx, cy) - 1;
    const rad = hue * Math.PI / 180;
    ppMarkerEl.style.left = (cx + Math.cos(rad) * sat * R) + 'px';
    ppMarkerEl.style.top  = (cy + Math.sin(rad) * sat * R) + 'px';
}

let wheelDragging = false;
function wheelPick(ev) {
    const rect = ppWheelEl.getBoundingClientRect();
    let dx = ev.clientX - rect.left - ppWheelEl.width / 2;
    let dy = ev.clientY - rect.top  - ppWheelEl.height / 2;
    const R = Math.min(ppWheelEl.width, ppWheelEl.height) / 2 - 1;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > R) { dx *= R / dist; dy *= R / dist; }
    let hue = Math.atan2(dy, dx) * 180 / Math.PI;
    if (hue < 0) hue += 360;
    const sat = Math.min(dist / R, 1);
    positionMarker(hue, sat);
    const [r, g, b] = hsvToRgb(hue, sat, ppValueEl.value / 100);
    paintLocal(rgbToHex(r, g, b)); // nur zeichnen — senden erst bei pointerup
}
ppWheelEl.addEventListener('pointerdown', (e) => { wheelDragging = true; wheelPick(e); });
window.addEventListener('pointermove', (e) => { if (wheelDragging) wheelPick(e); });
window.addEventListener('pointerup', () => { if (wheelDragging) { wheelDragging = false; commitSelected(); } });
ppValueEl.addEventListener('input', () => { // während des Ziehens: nur zeichnen
    const [h, s] = rgbToHsv(...hexToRgb(lastColor));
    const [r, g, b] = hsvToRgb(h, s, ppValueEl.value / 100);
    paintLocal(rgbToHex(r, g, b));
});
ppValueEl.addEventListener('change', () => commitSelected()); // Regler losgelassen -> senden

// ─── Office-Style Palette (Grundfarben-Spalten mit Tint/Shade-Abstufung) ──────

function buildColorGrid() {
    ppGridEl.style.gridTemplateColumns = `repeat(${GRID_BASE_HUES.length}, 16px)`;
    const rowFns = [
        h => mixHex(h, [255, 255, 255], 0.6),
        h => mixHex(h, [255, 255, 255], 0.3),
        h => h,
        h => mixHex(h, [0, 0, 0], 0.3),
        h => mixHex(h, [0, 0, 0], 0.6),
    ];
    rowFns.forEach(fn => {
        GRID_BASE_HUES.forEach(base => {
            const hex = fn(base);
            const sw = document.createElement('div');
            sw.className = 'grid-swatch';
            sw.style.background = hex;
            sw.title = hex;
            sw.onclick = () => applyColor(hex);
            ppGridEl.appendChild(sw);
        });
    });
}

document.querySelectorAll('.pp-tab').forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll('.pp-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pp-tabpanel').forEach(p => p.classList.add('hidden'));
        tab.classList.add('active');
        document.getElementById('pp-tab-' + tab.dataset.tab).classList.remove('hidden');
    };
});

// Hält Farbwähler, Hex-Feld, Rad-Marker und Value-Regler synchron zu `hex`.
function syncPickerUI(hex) {
    ppColorEl.value = hex;
    ppHexEl.value = hex;
    const [h, s, v] = rgbToHsv(...hexToRgb(hex));
    positionMarker(h, s);
    // v=0 (z.B. von Schwarz/"Aus") würde den Regler auf 0 kleben lassen —
    // dann liefert jede Hue/Sat-Wahl im Rad wieder Schwarz. Bei 0 auf volle
    // Helligkeit vorbelegen, damit das Rad sofort nutzbar bleibt.
    ppValueEl.value = Math.round((v === 0 ? 1 : v) * 100);
}

// Zeichnet `hex` sofort auf allen markierten Tasten im Browser (kein HID-
// Send) — für kontinuierliches Ziehen (Rad, Value-Regler), damit das nicht
// pro Zwischenschritt × Anzahl markierter Tasten Raw-HID-Reports verschickt
// und dadurch spürbar nachhinkt. Merkt sich `hex` als "zuletzt benutzt".
function paintLocal(hex) {
    lastColor = hex;
    syncPickerUI(hex);
    for (const led of selected) {
        colors[currentLayer][led] = hex;
        const el = ledToEl.get(led);
        if (el) el.style.background = hex;
    }
}

// Sendet die zuletzt gezeichnete Farbe (lastColor) an alle markierten Tasten
// — einmalig, z.B. beim Loslassen der Maus/des Reglers.
async function commitSelected() {
    if (selected.size === 0) return;
    const hex = lastColor;
    let failed = 0;
    for (const led of selected) {
        // Pro Taste einzeln fangen — ein einzelner fehlgeschlagener Send darf
        // nicht die restliche Mehrfachauswahl abbrechen.
        try { await sendKeyColor(currentLayer, led, hex); }
        catch (err) { failed++; }
    }
    setStatus(failed
        ? `${failed} of ${selected.size} key(s) failed to send`
        : `Color set on ${selected.size} key(s)`, failed > 0);
}

// Für diskrete Einzel-Klicks (Favoriten, Palette, Hex-Feld, nativer Picker):
// sofort zeichnen UND senden in einem Schritt.
async function applyColor(hex) {
    if (selected.size === 0) return;
    paintLocal(hex);
    await commitSelected();
}

function select(led, el) {
    if (selected.has(led)) return;
    selected.add(led);
    if (el) el.classList.add('selected');
}

function clearSelection() {
    selected.forEach(led => { const el = ledToEl.get(led); if (el) el.classList.remove('selected'); });
    selected.clear();
}

// Platziert das Popup neben (nicht über) der aktuellen Auswahl, bevorzugt
// rechts davon, sonst links, und immer innerhalb des sichtbaren Fensters —
// sonst verdeckt es genau die Tasten, die man per Strg+Klick noch dazu
// nehmen will, oder rutscht am Bildschirmrand raus.
function positionPopupNearSelection() {
    let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
    selected.forEach(led => {
        const el = ledToEl.get(led);
        if (!el) return;
        const r = el.getBoundingClientRect();
        left = Math.min(left, r.left); top = Math.min(top, r.top);
        right = Math.max(right, r.right); bottom = Math.max(bottom, r.bottom);
    });
    if (!isFinite(left)) return;

    const margin = 48;
    const pw = popupEl.offsetWidth, ph = popupEl.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;

    let x = right + margin; // bevorzugt rechts neben der Auswahl
    if (x + pw > vw - margin) {
        x = left - pw - margin; // passt nicht -> links davon
    }
    x = Math.min(Math.max(x, margin), Math.max(margin, vw - pw - margin));

    let y = top;
    y = Math.min(Math.max(y, margin), Math.max(margin, vh - ph - margin));

    popupEl.style.left = (x + window.scrollX) + 'px';
    popupEl.style.top  = (y + window.scrollY) + 'px';
}

// Zeigt den Lock-Flag-Status der ERSTEN markierten Taste (Set behält
// Einfüge-Reihenfolge) — bei Mehrfachauswahl mit unterschiedlichen Zuständen
// ist das nur eine Annäherung, aber Lock-Flags sind ohnehin meist Einzeltasten.
function syncLockCheckboxes() {
    const firstLed = selected.values().next().value;
    const flags = firstLed !== undefined ? (lockFlags[currentLayer][firstLed] || 0) : 0;
    ppLockNumEl.checked  = !!(flags & LOCK_FLAG_NUM);
    ppLockCapsEl.checked = !!(flags & LOCK_FLAG_CAPS);
    ppLockScrlEl.checked = !!(flags & LOCK_FLAG_SCRL);
    ppLockBlinkEl.checked = !!(flags & LOCK_FLAG_BLINK);
    ppBlinkRowEl.classList.toggle('hidden', !ppLockBlinkEl.checked);
    const blinkHex = firstLed !== undefined ? (blinkColors[currentLayer][firstLed] || '#000000') : '#000000';
    ppBlinkColorEl.value = blinkHex;
    ppBlinkHexEl.value = blinkHex;
}

// Wendet ein einzelnes Lock-Flag-Bit auf ALLE markierten Tasten an (analog
// zu Farben) — sofort gesendet, muss aber wie Farben noch "gespeichert"
// werden (EEPROM), damit's einen Reboot übersteht.
async function applyLockFlagToSelection(bit, enabled) {
    for (const led of selected) {
        let flags = lockFlags[currentLayer][led] || 0;
        flags = enabled ? (flags | bit) : (flags & ~bit);
        lockFlags[currentLayer][led] = flags;
        try { await sendKeyLockFlags(currentLayer, led, flags); }
        catch (err) { setStatus('Send failed: ' + err.message, true); }
    }
}
ppLockNumEl.addEventListener('change', () => applyLockFlagToSelection(LOCK_FLAG_NUM, ppLockNumEl.checked));
ppLockCapsEl.addEventListener('change', () => applyLockFlagToSelection(LOCK_FLAG_CAPS, ppLockCapsEl.checked));
ppLockScrlEl.addEventListener('change', () => applyLockFlagToSelection(LOCK_FLAG_SCRL, ppLockScrlEl.checked));
ppLockBlinkEl.addEventListener('change', () => {
    ppBlinkRowEl.classList.toggle('hidden', !ppLockBlinkEl.checked);
    applyLockFlagToSelection(LOCK_FLAG_BLINK, ppLockBlinkEl.checked);
});

// Sendet die aktuelle Blink-Farbe an alle markierten Tasten — analog zu
// applyColor()/commitSelected(), aber eigenes (kleineres) Farbfeld ohne
// Rad/Palette, da nur ein selten genutzter Sekundärwert.
async function commitBlinkSelected(hex) {
    for (const led of selected) {
        blinkColors[currentLayer][led] = hex;
        try { await sendBlinkColor(currentLayer, led, hex); }
        catch (err) { setStatus('Send failed: ' + err.message, true); }
    }
}
ppBlinkColorEl.addEventListener('change', () => commitBlinkSelected(ppBlinkColorEl.value));
ppBlinkHexEl.addEventListener('change', () => {
    let v = ppBlinkHexEl.value.trim();
    if (v && !v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { ppBlinkColorEl.value = v; commitBlinkSelected(v); }
    else ppBlinkHexEl.value = ppBlinkColorEl.value;
});

function openPickerAt() {
    syncPickerUI(lastColor);
    renderFavorites();
    syncLockCheckboxes();
    popupEl.classList.remove('hidden');
    positionPopupNearSelection();
}

// Klick = nur diese Taste markieren. Strg/Cmd+Klick = Taste an/abwählen,
// bestehende Auswahl bleibt (Mehrfachauswahl für gleiche Farbe auf einmal).
function onSelectableClick(led, el, ev) {
    ev.stopPropagation();
    if (ev.ctrlKey || ev.metaKey) {
        if (selected.has(led)) { selected.delete(led); el.classList.remove('selected'); }
        else select(led, el);
        if (selected.size === 0) { closePicker(); return; }
    } else {
        clearSelection();
        select(led, el);
    }
    openPickerAt();
}

function closePicker() {
    popupEl.classList.add('hidden');
    clearSelection();
}

// ─── Rechteck-Auswahl (Ziehen auf leerem Hintergrund) ─────────────────────────

const marqueeEl = document.getElementById('marquee');
let dragStart = null;
let suppressNextClick = false;

document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.key, .ug, #picker-popup')) return;
    dragStart = { x: e.clientX, y: e.clientY };
    marqueeEl.style.left = e.clientX + 'px';
    marqueeEl.style.top  = e.clientY + 'px';
    marqueeEl.style.width  = '0px';
    marqueeEl.style.height = '0px';
    marqueeEl.style.display = 'block';
});

document.addEventListener('mousemove', (e) => {
    if (!dragStart) return;
    const x1 = Math.min(dragStart.x, e.clientX), x2 = Math.max(dragStart.x, e.clientX);
    const y1 = Math.min(dragStart.y, e.clientY), y2 = Math.max(dragStart.y, e.clientY);
    marqueeEl.style.left = x1 + 'px'; marqueeEl.style.top = y1 + 'px';
    marqueeEl.style.width = (x2 - x1) + 'px'; marqueeEl.style.height = (y2 - y1) + 'px';
});

document.addEventListener('mouseup', (e) => {
    if (!dragStart) return;
    const x1 = Math.min(dragStart.x, e.clientX), x2 = Math.max(dragStart.x, e.clientX);
    const y1 = Math.min(dragStart.y, e.clientY), y2 = Math.max(dragStart.y, e.clientY);
    marqueeEl.style.display = 'none';
    const dragged = (x2 - x1 > 3 || y2 - y1 > 3);
    dragStart = null;
    if (!dragged) return; // winziger Klick, kein Rechteck -> normales Klick/Close-Handling greift

    if (!(e.ctrlKey || e.metaKey)) clearSelection();
    ledToEl.forEach((el, led) => {
        const r = el.getBoundingClientRect();
        if (r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1) select(led, el);
    });
    if (selected.size > 0) {
        suppressNextClick = true; // der nachfolgende 'click' auf demselben Ziel darf das Popup nicht sofort schließen
        openPickerAt();
    }
});

ppColorEl.addEventListener('input', () => paintLocal(ppColorEl.value));  // während Ziehen im OS-Dialog: nur zeichnen
ppColorEl.addEventListener('change', () => commitSelected());            // Dialog bestätigt: senden
ppHexEl.addEventListener('change', () => {
    let v = ppHexEl.value.trim();
    if (v && !v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) applyColor(v);
    else ppHexEl.value = lastColor;
});
ppFavAddEl.onclick = () => {
    if (!favorites.includes(lastColor)) {
        favorites.push(lastColor);
        saveFavorites();
        renderFavorites();
    }
};
popupEl.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', (e) => {
    if (suppressNextClick) { suppressNextClick = false; return; }
    if (e.ctrlKey || e.metaKey) return; // Strg/Cmd+Klick ins Leere darf die Auswahl nicht verwerfen
    closePicker();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

async function selectLayer(layer) {
    currentLayer = layer;
    buildLayerTabs();
    setStatus('Loading layer ' + layer + ' …');
    try {
        await fetchLayerColors(layer);
        await fetchLayerBlinkColors(layer);
        await fetchLayerLockFlags(layer);
        redrawBoard();
        setStatus('Connected — layer ' + layer);
    } catch (err) {
        setStatus('Load failed: ' + err.message, true);
    }
}

async function connect() {
    try {
        const devices = await navigator.hid.requestDevice({ filters: [{ usagePage: USAGE_PAGE, usage: USAGE }] });
        if (!devices.length) return;
        device = devices[0];
        await device.open();
        device.addEventListener('inputreport', onInputReport);

        setStatus('Reading layout from keyboard …');
        await loadLayoutFromDevice();
        LAYER_COUNT = await viaGetLayerCount();
        colors = Array.from({length: LAYER_COUNT}, () => new Array(LED_COUNT).fill('#000000'));
        blinkColors = Array.from({length: LAYER_COUNT}, () => new Array(LED_COUNT).fill('#000000'));
        lockFlags = Array.from({length: LAYER_COUNT}, () => new Array(LED_COUNT).fill(0));

        buildLayerTabs();
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        saveBtn.disabled = false;
        exportBtn.disabled = false;
        importBtn.disabled = false;
        statusEl.classList.add('connected');
        await selectLayer(0);
    } catch (err) {
        setStatus('Connection failed: ' + err.message, true);
        if (device) { try { await device.close(); } catch (_) {} device = null; }
    }
}

async function disconnect() {
    if (device) {
        try {
            device.removeEventListener('inputreport', onInputReport);
            await device.close();
        } catch (err) { /* already gone */ }
    }
    device = null;
    closePicker();
    resetBoard();
    lastKeys = lastMatrixToLed = lastUgEntries = null; // Resize soll nichts Veraltetes neu zeichnen
    layersEl.innerHTML = '';
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    saveBtn.disabled = true;
    exportBtn.disabled = true;
    importBtn.disabled = true;
    statusEl.classList.remove('connected');
    setStatus('Disconnected — click Connect');
}

// Liest ALLE Layer frisch vom Gerät (nicht nur die im Speicher schon
// besuchten — sonst würden unbesuchte Layer als Platzhalter-Schwarz
// exportiert statt mit ihrem echten Inhalt) und lädt das Ergebnis als JSON
// herunter. Reiner Browser-Vorgang, unabhängig vom EEPROM-Save.
async function exportConfig() {
    if (!device) return;
    saveBtn.disabled = exportBtn.disabled = importBtn.disabled = true;
    try {
        for (let l = 0; l < LAYER_COUNT; l++) {
            setStatus(`Reading layer ${l + 1}/${LAYER_COUNT} for export …`);
            await fetchLayerColors(l);
            await fetchLayerBlinkColors(l);
            await fetchLayerLockFlags(l);
        }
        const payload = {
            format: 'webgui-key-colors-v1',
            keyboardName, ledCount: LED_COUNT, layerCount: LAYER_COUNT,
            colors, lockFlags, blinkColors,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = keyboardName.replace(/[^\w-]+/g, '_') + '-colors.json';
        a.click();
        URL.revokeObjectURL(url);
        redrawBoard();
        setStatus('Exported — layer ' + currentLayer);
    } catch (err) {
        setStatus('Export failed: ' + err.message, true);
    } finally {
        saveBtn.disabled = exportBtn.disabled = importBtn.disabled = false;
    }
}

// Schreibt eine exportierte Datei zurück aufs Gerät (live, wie manuelles
// Zuweisen — Save-Button danach nötig für EEPROM-Persistenz). Bei
// abweichender LED-/Layer-Zahl (z.B. Datei von einem anderen Board) wird nur
// der überlappende Teil übernommen, nach Rückfrage.
async function importConfig(file) {
    if (!device) return;
    let payload;
    try { payload = JSON.parse(await file.text()); }
    catch (err) { setStatus('Import failed: not valid JSON', true); return; }

    if (!payload || !Array.isArray(payload.colors) || !Array.isArray(payload.lockFlags)) {
        setStatus('Import failed: unrecognized file format', true);
        return;
    }
    if ((payload.ledCount && payload.ledCount !== LED_COUNT) || (payload.layerCount && payload.layerCount !== LAYER_COUNT)) {
        const proceed = confirm(
            `This file was exported for "${payload.keyboardName || '?'}" ` +
            `(${payload.ledCount ?? '?'} LEDs, ${payload.layerCount ?? '?'} layers) — ` +
            `this device has ${LED_COUNT} LEDs, ${LAYER_COUNT} layers. Import the overlapping part anyway?`
        );
        if (!proceed) return;
    }

    saveBtn.disabled = exportBtn.disabled = importBtn.disabled = true;
    try {
        const layers = Math.min(LAYER_COUNT, payload.colors.length);
        for (let l = 0; l < layers; l++) {
            const leds = Math.min(LED_COUNT, payload.colors[l].length);
            for (let led = 0; led < leds; led++) {
                setStatus(`Importing layer ${l + 1}/${layers}, key ${led + 1}/${leds} …`);
                const hex = payload.colors[l][led] || '#000000';
                colors[l][led] = hex;
                await sendKeyColor(l, led, hex);

                // blinkColors optional — Export-Dateien von vor dem Blink-Feature
                // haben das Feld nicht, fällt dann auf Schwarz zurück.
                const blinkHex = (payload.blinkColors && payload.blinkColors[l] && payload.blinkColors[l][led]) || '#000000';
                blinkColors[l][led] = blinkHex;
                await sendBlinkColor(l, led, blinkHex);

                const flags = (payload.lockFlags[l] && payload.lockFlags[l][led]) || 0;
                lockFlags[l][led] = flags;
                await sendKeyLockFlags(l, led, flags);
            }
        }
        redrawBoard();
        setStatus('Imported — click Save to persist to EEPROM');
    } catch (err) {
        setStatus('Import failed: ' + err.message, true);
    } finally {
        saveBtn.disabled = exportBtn.disabled = importBtn.disabled = false;
    }
}

async function save() {
    saveBtn.disabled = true;
    setStatus('Saving to EEPROM …');
    try {
        await send([0x02, COMMIT_COLORS]);
        // Wartet auf die ECHTE Bestätigung, dass der Flash-Schreibvorgang
        // abgeschlossen ist (nicht nur "USB-Report verschickt") — sonst kann
        // ein Reboot direkt nach "Saved" mitten in den Schreibvorgang
        // platzen und den kompletten Datenblock zerstören (alle Farben weg).
        // Flash-Erase/Write kann länger dauern als der sonstige 1s-Timeout.
        await waitFor(r => r.getUint8(0) === 0x02 && r.getUint8(1) === COMMIT_COLORS, 5000);
        setStatus('Saved (EEPROM) — safe to reboot now');
    } catch (err) {
        setStatus('Save failed: ' + err.message, true);
    } finally {
        saveBtn.disabled = false;
    }
}

drawWheel();
buildColorGrid();

if (!('hid' in navigator)) {
    setStatus('WebHID not available — Chrome/Edge/Opera required', true);
} else {
    connectBtn.disabled = false;
    connectBtn.onclick = connect;
    disconnectBtn.onclick = disconnect;
    saveBtn.onclick = save;
    exportBtn.onclick = exportConfig;
    importBtn.onclick = () => importFileEl.click();
    importFileEl.onchange = () => {
        if (importFileEl.files[0]) importConfig(importFileEl.files[0]);
        importFileEl.value = ''; // gleiche Datei erneut auswählbar
    };
}
</script>
</body>
</html>
